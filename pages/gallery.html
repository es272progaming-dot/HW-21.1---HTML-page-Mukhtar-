    <!-- Проверка на использование карусели бутстреп с фотографиями Мухтара 
    <h2 class="text-center">Фотографии Мухтара</h2>-->
<div id="carouselExampleCaptions" class="carousel slide">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Слайд 1"></button>
    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Слайд 2"></button>
  </div>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="../photos/mukhtar1.jpg" class="d-block mx-auto" alt="Мухтар">
      <div class="carousel-caption d-none d-md-block">
    <h5>Мухтар</h5>
    <p>Наш любимый пёс.</p>
    </div>
    </div>
    <div class="carousel-item">
      <img src="../photos/mukhtar2.jpg" class="d-block mx-auto" alt="Мухтар">
       <div class="carousel-caption d-none d-md-block">
        <h5>Мухтар</h5>
        <p>Наш верный друг</p>
    </div>
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Предыдущий</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Следующий</span>
  </button>
</div>
